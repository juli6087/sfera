<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог товаров и услуг — Сфера</title>

    <!-- Подключение шрифтов Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Montserrat:wght@400;500;600;700;800;900&amp;family=Roboto:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet">

    <!-- Подключение иконок Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Компоненты и глобальные скрипты -->
    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
    <script src="../js/script.js"></script>
    <link rel="stylesheet" href="../css/style.css">

    <!-- База данных и скрипт каталога -->
    <script src="../js/db.js"></script>
    <script src="catalog.js" defer></script>

    <script>const PATH_PREFIX = "../";</script>
</head>

<body class="min-h-screen flex flex-col font-sans bg-white">
    <!-- Шапка сайта -->
    <div id="header-placeholder"></div>

    <!-- Основной контент каталога -->
    <main class="flex-grow max-w-[1600px] mx-auto w-full px-4 sm:px-6 py-8">

        <!-- Хлебные крошки (bitrix:breadcrumb) -->
        <nav aria-label="Хлебные крошки" itemscope itemtype="https://schema.org/BreadcrumbList"
            class="flex items-center gap-2 text-[13px] font-medium text-gray-400 mb-6 flex-wrap">
            <span itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem"
                class="flex items-center gap-2">
                <a itemprop="item" href="../index.html"
                    class="hover:text-textMain transition-colors flex items-center gap-1">
                    <span itemprop="name">Главная</span>
                </a>
                <meta itemprop="position" content="1" />
                <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-300"></i>
            </span>
            <span itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                <span itemprop="name" id="catalog-crumb-category" class="text-gray-800 font-semibold">Товары</span>
                <meta itemprop="position" content="2" />
            </span>
        </nav>

        <!-- Заголовок страницы и плашка с количеством товаров -->
        <div class="mb-8 flex items-center justify-between gap-4">
            <h1 id="catalog-page-title" class="text-3xl sm:text-4xl font-bold tracking-tight text-gray-900">
                Каталог товаров
            </h1>
            <span id="catalog-total-count" class="inline-flex items-center text-xs sm:text-sm font-semibold text-gray-600 bg-surfaceLight border border-gray-200/80 px-4 py-1.5 rounded-full shadow-xs shrink-0">
                0 товаров
            </span>
        </div>

        <!-- Сетка карточек товаров и услуг (полная ширина без сайдбара фильтров) -->
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 2xl:grid-cols-5 gap-6">
            <!-- Карточки товаров и услуг генерируются скриптом -->
        </div>

        <!-- Состояние: Ничего не найдено -->
        <div id="empty-state"
            class="hidden bg-white rounded-[28px] border border-gray-100 p-12 text-center my-8 shadow-sm">
            <div
                class="w-16 h-16 bg-blue-50 text-accent rounded-full flex items-center justify-center mx-auto mb-4">
                <i data-lucide="search-x" class="w-8 h-8"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-900 mb-2">Ничего не найдено</h3>
            <p class="text-gray-500 max-w-md mx-auto text-sm mb-6">
                Попробуйте изменить поисковый запрос или выбрать другой раздел каталога.
            </p>
            <button onclick="resetCatalogView()"
                class="bg-accent hover:bg-accent-hover text-white px-6 py-2.5 rounded-xl font-semibold text-sm transition-all shadow-md shadow-accent/20">
                Сбросить поиск и раздел
            </button>
        </div>

        <!-- Постраничная навигация (Битрикс bitrix:system.pagenavigation) -->
        <div id="catalog-pagination" class="pt-10 flex items-center justify-center">
            <div class="flex items-center gap-1.5">
                <button
                    class="w-10 h-10 rounded-xl bg-white border border-gray-200 text-gray-400 hover:text-gray-700 hover:bg-surfaceLight flex items-center justify-center transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                    <i data-lucide="chevron-left" class="w-4 h-4"></i>
                </button>
                <button
                    class="w-10 h-10 rounded-xl bg-accent text-white font-bold text-sm flex items-center justify-center shadow-sm">
                    1
                </button>
                <button
                    class="w-10 h-10 rounded-xl bg-white border border-gray-200 text-gray-700 font-semibold text-sm hover:border-accent hover:text-accent flex items-center justify-center transition-colors">
                    2
                </button>
                <button
                    class="w-10 h-10 rounded-xl bg-white border border-gray-200 text-gray-700 font-semibold text-sm hover:border-accent hover:text-accent flex items-center justify-center transition-colors">
                    3
                </button>
                <span class="px-2 text-gray-400 font-medium">...</span>
                <button
                    class="px-4 h-10 rounded-xl bg-white border border-gray-200 text-gray-700 font-semibold text-sm hover:border-accent hover:text-accent flex items-center justify-center transition-colors">
                    Вперед
                </button>
            </div>
        </div>

    </main>

    <!-- Подвал сайта -->
    <div id="footer-placeholder"></div>

</body>

</html>
