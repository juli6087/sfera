<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог — Сфера</title>

    <!-- Подключение шрифтов Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Montserrat:wght@400;500;600;700;800;900&amp;family=Roboto:wght@400;500;700;900&amp;display=swap"
        rel="stylesheet">

    <!-- Подключение иконок Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Компоненты и скрипты -->
    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
    <script src="../js/script.js"></script>
    <link rel="stylesheet" href="../css/style.css">

    <script>const PATH_PREFIX = "../";</script>
</head>

<body class="min-h-screen flex flex-col font-sans bg-white">
    <!-- Шапка сайта -->
    <div id="header-placeholder"></div>

    <!-- Основной контент страницы категорий -->
    <main class="flex-grow max-w-[1600px] mx-auto w-full px-4 sm:px-6 py-8">

        <!-- Хлебные крошки (bitrix:breadcrumb) -->
        <nav aria-label="Хлебные крошки" itemscope itemtype="https://schema.org/BreadcrumbList"
            class="flex items-center gap-2 text-[13px] font-medium text-gray-400 mb-6 flex-wrap">
            <span itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem"
                class="flex items-center gap-2">
                <a itemprop="item" href="../index.html"
                    class="hover:text-textMain transition-colors flex items-center gap-1">
                    <span itemprop="name">Главная</span>
                </a>
                <meta itemprop="position" content="1" />
                <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-300"></i>
            </span>
            <span itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                <span itemprop="name" class="text-gray-800 font-semibold">Каталог</span>
                <meta itemprop="position" content="2" />
            </span>
        </nav>

        <!-- Заголовок страницы -->
        <div class="mb-8 sm:mb-10">
            <h1 class="text-3xl sm:text-4xl font-bold tracking-tight text-gray-900">Каталог</h1>
        </div>

        <!-- Сетка категорий: только 2 категории (Товары и Услуги) в единой стилистике сайта -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-6 sm:gap-8 max-w-4xl">

            <!-- Категория 1: Товары -->
            <a href="../catalog/index.html?type=products" class="group flex flex-col">
                <div class="w-full aspect-[4/3] rounded-[28px] overflow-hidden transition-all duration-300 relative bg-white">
                    <img src="../images/category-products.jpg" alt="Товары"
                        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                </div>
                <div class="flex items-center justify-between mt-4 px-1">
                    <span class="text-xl sm:text-2xl font-bold text-gray-900">
                        Товары
                    </span>
                    <i data-lucide="arrow-right" class="w-6 h-6 text-gray-400 group-hover:text-accent group-hover:translate-x-1.5 transition-all duration-300"></i>
                </div>
            </a>

            <!-- Категория 2: Услуги -->
            <a href="../catalog/index.html?type=services" class="group flex flex-col">
                <div class="w-full aspect-[4/3] rounded-[28px] overflow-hidden transition-all duration-300 relative bg-white">
                    <img src="../images/category-services.jpg" alt="Услуги"
                        class="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105">
                </div>
                <div class="flex items-center justify-between mt-4 px-1">
                    <span class="text-xl sm:text-2xl font-bold text-gray-900">
                        Услуги
                    </span>
                    <i data-lucide="arrow-right" class="w-6 h-6 text-gray-400 group-hover:text-accent group-hover:translate-x-1.5 transition-all duration-300"></i>
                </div>
            </a>

        </div>

    </main>

    <!-- Подвал сайта -->
    <div id="footer-placeholder"></div>

</body>

</html>
