<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Услуги — Сфера</title>

    <!-- Подключение шрифтов Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">

    <!-- Подключение иконок Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Подключение Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Подключение общих скриптов конфигурации Tailwind и стилей -->
    
    <!-- Компоненты -->
    <script src="../components/header.js"></script>
    <script src="../components/footer.js"></script>
    <script src="../js/script.js"></script>
    <link rel="stylesheet" href="../css/style.css">

    <!-- Подключение скрипта услуг -->
    <script src="../js/db.js"></script>
    <script src="services.js" defer></script>

    <script>const PATH_PREFIX = "../";</script>
</head>

<body class="min-h-screen flex flex-col font-sans bg-[#fafafa]">
    <!-- Шапка сайта -->
    <div id="header-placeholder"></div>

    <!-- Основной контент страницы услуг -->
    <main class="flex-grow max-w-[1600px] mx-auto w-full px-4 sm:px-6 py-8">

        <!-- Хлебные крошки (Цепочка навигации 1С-Битрикс: bitrix:breadcrumb) -->
        <nav aria-label="Хлебные крошки" itemscope itemtype="https://schema.org/BreadcrumbList" class="flex items-center gap-2 text-[13px] font-medium text-gray-400 mb-6 flex-wrap">
            <span itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem" class="flex items-center gap-2">
                <a itemprop="item" href="../index.html" class="hover:text-textMain transition-colors flex items-center gap-1">
                    <span itemprop="name">Главная</span>
                </a>
                <meta itemprop="position" content="1" />
                <i data-lucide="chevron-right" class="w-3.5 h-3.5 text-gray-300"></i>
            </span>
            <span itemprop="itemListElement" itemscope itemtype="https://schema.org/ListItem">
                <span itemprop="name" id="services-crumb-category" class="text-gray-800 font-semibold">Все услуги</span>
                <meta itemprop="position" content="2" />
            </span>
        </nav>

        <!-- Заголовок страницы -->
        <div class="mb-6">
            <h1 id="services-page-title" class="text-3xl sm:text-4xl font-bold tracking-tight text-gray-900">Услуги</h1>
        </div>

        <!-- Горизонтальные быстрые фильтры по категориям (Pill tabs) -->
        <div class="flex items-center gap-2.5 overflow-x-auto pb-2 scrollbar-none mb-10">
            <button data-category="all"
                class="service-cat-pill whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-semibold transition-all bg-accent text-white shadow-md shadow-accent/20">
                Все услуги
            </button>
            <button data-category="repair"
                class="service-cat-pill whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-semibold transition-all bg-surfaceLight text-gray-700 hover:bg-gray-200">
                Ремонт техники
            </button>
            <button data-category="cleaning"
                class="service-cat-pill whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-semibold transition-all bg-surfaceLight text-gray-700 hover:bg-gray-200">
                Клининг
            </button>
            <button data-category="handyman"
                class="service-cat-pill whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-semibold transition-all bg-surfaceLight text-gray-700 hover:bg-gray-200">
                Мастер на час
            </button>
            <button data-category="pets"
                class="service-cat-pill whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-semibold transition-all bg-surfaceLight text-gray-700 hover:bg-gray-200">
                Уход за животными
            </button>
            <button data-category="beauty"
                class="service-cat-pill whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-semibold transition-all bg-surfaceLight text-gray-700 hover:bg-gray-200">
                Красота и уход
            </button>
            <button data-category="auto"
                class="service-cat-pill whitespace-nowrap px-5 py-2.5 rounded-full text-sm font-semibold transition-all bg-surfaceLight text-gray-700 hover:bg-gray-200">
                Автоуслуги
            </button>
        </div>

        <!-- Сетка услуг (без бокового фильтра, карточки в точности как на главной) -->
        <div class="w-full space-y-10">

            <div id="services-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                <!-- Карточки генерируются скриптом services.js -->
            </div>

            <!-- Состояние: Ничего не найдено -->
            <div id="services-empty-state" class="hidden bg-white rounded-[28px] border border-gray-100 p-12 text-center my-8 shadow-sm">
                <div class="w-16 h-16 bg-blue-50 text-accent rounded-full flex items-center justify-center mx-auto mb-4">
                    <i data-lucide="search-x" class="w-8 h-8"></i>
                </div>
                <h3 class="text-xl font-bold text-gray-900 mb-2">Услуги не найдены</h3>
                <p class="text-gray-500 max-w-md mx-auto text-sm mb-6">
                    В выбранной категории сейчас нет доступных услуг.
                </p>
                <button onclick="document.querySelector('.service-cat-pill[data-category=\'all\']').click()"
                    class="bg-accent hover:bg-accent-hover text-white px-6 py-2.5 rounded-lg font-semibold text-sm transition-all">
                    Показать все услуги
                </button>
            </div>

            <!-- Пагинация (Шаблон компонента system.pagenavigation для 1С-Битрикс) -->
            <div id="services-pagination" class="pt-8 flex items-center justify-center border-t border-gray-100">
                <div class="flex items-center gap-1.5">
                    <button class="w-10 h-10 rounded-xl bg-white border border-gray-200 text-gray-400 hover:text-gray-700 hover:bg-surfaceLight flex items-center justify-center transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                        <i data-lucide="chevron-left" class="w-4 h-4"></i>
                    </button>
                    <button class="w-10 h-10 rounded-xl bg-accent text-white font-bold text-sm flex items-center justify-center shadow-sm">
                        1
                    </button>
                    <button class="w-10 h-10 rounded-xl bg-white border border-gray-200 text-gray-700 font-semibold text-sm hover:border-accent hover:text-accent flex items-center justify-center transition-colors">
                        2
                    </button>
                    <button class="w-10 h-10 rounded-xl bg-white border border-gray-200 text-gray-700 font-semibold text-sm hover:border-accent hover:text-accent flex items-center justify-center transition-colors">
                        3
                    </button>
                    <span class="px-2 text-gray-400 font-medium">...</span>
                    <button class="w-10 h-10 rounded-xl bg-white border border-gray-200 text-gray-700 font-semibold text-sm hover:border-accent hover:text-accent flex items-center justify-center transition-colors">
                        5
                    </button>
                    <button class="px-4 h-10 rounded-xl bg-white border border-gray-200 text-gray-700 font-semibold text-sm hover:border-accent hover:text-accent flex items-center justify-center transition-colors">
                        Вперед
                    </button>
                </div>
            </div>

        </div>
    </main>

    <!-- Подвал сайта -->
    <div id="footer-placeholder"></div>

</body>

</html>
